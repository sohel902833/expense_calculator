name: expense_calculator
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.9.0

dependencies:
  async: ^2.13.0
  cloud_firestore: ^6.0.1
  crypto: ^3.0.6
  drift: ^2.22.1
  firebase_auth: ^6.0.2
  firebase_core: ^4.1.0
  firebase_storage: ^13.0.1
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  image_picker: ^1.2.0
  local_auth: ^2.3.0
  path: ^1.9.0
  path_provider: ^2.1.5
  percent_indicator: ^4.2.5
  shared_preferences: ^2.3.2
  sqlite3_flutter_libs: ^0.5.27
  uuid: ^4.5.1

dev_dependencies:
  build_runner: ^2.4.13
  drift_dev: ^2.22.1
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.4

flutter:
  uses-material-design: true
  assets:
    - assets/icon/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "assets/icon/icon_background.png"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  min_sdk_android: 21
  remove_alpha_ios: true

flutter_native_splash:
  color: "#0B6E56"
  image: assets/icon/splash_logo.png
  color_dark: "#0B6E56"
  image_dark: assets/icon/splash_logo.png
  android_12:
    image: assets/icon/splash_logo.png
    icon_background_color: "#0B6E56"
    image_dark: assets/icon/splash_logo.png
    icon_background_color_dark: "#0B6E56"
  android: true
  ios: true
  web: false
